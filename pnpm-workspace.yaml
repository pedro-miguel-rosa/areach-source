packages:
  - apps/*
  - packages/*

allowBuilds:
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@expo/cli@56.1.13 || 57.0.25'
  - '@expo/package-manager@1.12.1'
  - '@expo/prebuild-config@56.0.14'
  - '@expo/ui@56.0.15'
  - expo-dev-client@56.0.18
  - expo-dev-launcher@56.0.18
  - expo-dev-menu@56.0.16
  - expo-linking@56.0.13
  - expo-modules-core@56.0.14
  - expo-router@56.2.8
  - expo-widgets@56.0.16
  - expo@56.0.7 || 57.0.23
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12

nodeLinker: hoisted
